<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <path id="sole" d="M6,-84 C26,-84 37,-66 35,-42 C33,-20 22,-4 20,14 C18,32 26,50 24,66 C22,82 10,88 0,88 C-14,88 -25,80 -25,64 C-25,46 -29,22 -33,0 C-37,-24 -37,-50 -31,-64 C-25,-78 -10,-84 6,-84 Z"/>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E8E4DC"/>
    </marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C8102E"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#B5A160"/>
    </marker>
    <clipPath id="heel"><rect x="-40" y="46" width="80" height="50"/></clipPath>
  </defs>

  <rect x="0" y="0" width="800" height="600" rx="28" fill="#1A1A1A"/>
  <rect x="0" y="0" width="800" height="600" rx="28" fill="url(#grid)"/>

  <!-- opponent -->
  <g transform="translate(300.0,66.0)">
    <circle r="34" fill="#3A3A3C" stroke="#8E8E93" stroke-width="2"/>
    <circle r="20" fill="none" stroke="#8E8E93" stroke-width="3"/>
    <circle r="7" fill="#8E8E93"/>
  </g>

  <!-- original facing line (ghost) -->
  <line x1="300.0" y1="220.0" x2="300.0" y2="111.0" stroke="#8E8E93" stroke-width="3" stroke-dasharray="4 9" stroke-linecap="round" opacity="0.7"/>

  <!-- START position: faded outlines -->
  <g fill="none" stroke-width="3" stroke-dasharray="8 7" opacity="0.6">
    <use href="#sole" transform="translate(300.0,320.0)" stroke="#E35A6E"/>
  </g>

  <!-- lead foot swing arc -->
  <path d="M251.5,266.2 A303.2,303.2 0 0 1 396.1,155.1" fill="none" stroke="#C8102E" stroke-width="5" stroke-linecap="round" marker-end="url(#ahc)"/>

  <!-- END position: solid -->
  <g transform="translate(443.4,213.7) rotate(45)">
    <use href="#sole" fill="#C8102E" stroke="#F2B8C0" stroke-width="2"/>
  </g>
  <g transform="translate(450.0,440.0) rotate(90)">
    <use href="#sole" transform="scale(-1,1)" fill="#6B7F92" stroke="#C9D3DC" stroke-width="2"/>
    <g clip-path="url(#heel)">
      <use href="#sole" transform="scale(-1,1)" fill="#2B333B" opacity="0.75"/>
    </g>
    <g stroke="#C9D3DC" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <line x1="-14" y1="58" x2="14" y2="58"/>
      <line x1="-16" y1="68" x2="16" y2="68"/>
      <line x1="-12" y1="78" x2="12" y2="78"/>
    </g>
  </g>

  <g fill="none" stroke-width="3" stroke-dasharray="8 7" opacity="0.75">
    <use href="#sole" transform="translate(464.6,475.4) rotate(45) scale(-1,1)" stroke="#9FB0C0"/>
  </g>

  <!-- pivot point on the ball of the rear foot -->
  <circle cx="500" cy="440" r="13" fill="#B5A160" stroke="#1A1A1A" stroke-width="3"/>
  <circle cx="500" cy="440" r="4" fill="#1A1A1A"/>
  <path d="M462.4,426.3 A40,40 0 1 1 520.0,474.6" fill="none" stroke="#B5A160" stroke-width="4" stroke-linecap="round" marker-end="url(#ahb)"/>

  <!-- new facing direction -->
  <line x1="514.1" y1="143.0" x2="581.3" y2="75.8" stroke="#E8E4DC" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- step markers -->
  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    <circle cx="578.0" cy="510.0" r="19" fill="#B5A160"/>
    <text x="578.0" y="518.0" fill="#1A1A1A">1</text>
    <circle cx="292.1" cy="169.4" r="19" fill="#C8102E"/>
    <text x="292.1" y="177.4" fill="#FFFFFF">2</text>
  </g>
</svg>
