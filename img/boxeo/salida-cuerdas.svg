<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <path id="sole" d="M6,-84 C26,-84 37,-66 35,-42 C33,-20 22,-4 20,14 C18,32 26,50 24,66 C22,82 10,88 0,88 C-14,88 -25,80 -25,64 C-25,46 -29,22 -33,0 C-37,-24 -37,-50 -31,-64 C-25,-78 -10,-84 6,-84 Z"/>
    <marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8FA35A"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8E8E93"/></marker>
    <marker id="ahw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6E6E73"/></marker>
    <clipPath id="heel"><rect x="-40" y="46" width="80" height="50"/></clipPath>
  </defs>
  <rect x="0" y="0" width="800" height="600" rx="28" fill="#1A1A1A"/>
  <rect x="0" y="0" width="800" height="600" rx="28" fill="url(#grid)"/>
  <line x1="400" y1="40" x2="400" y2="530" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- ropes across the bottom with posts -->
  <rect x="48" y="500" width="704" height="46" rx="10" fill="#C8102E" opacity="0.09"/>
  <g stroke="#B08D57" stroke-linecap="round">
    <line x1="40" y1="556" x2="760" y2="556" stroke-width="5"/>
    <line x1="40" y1="570" x2="760" y2="570" stroke-width="3" opacity="0.55"/></g>
  <g fill="#6B7F92" stroke="#C9D3DC" stroke-width="2">
    <rect x="22" y="550" width="26" height="26" rx="5"/><rect x="752" y="550" width="26" height="26" rx="5"/></g>

  <!-- ===== OPTION 1: roll and step out at an angle, away from the loaded right hand ===== -->
  <g><circle cx="200.0" cy="175.0" r="28" fill="#3A3A3C" stroke="#8E8E93" stroke-width="2"/>
    <circle cx="200.0" cy="175.0" r="15" fill="none" stroke="#8E8E93" stroke-width="3"/>
    <circle cx="200.0" cy="175.0" r="5" fill="#8E8E93"/><circle cx="224.0" cy="201.0" r="10" fill="#3A3A3C" stroke="#8E8E93" stroke-width="2.5"/>
    <circle cx="176.0" cy="201.0" r="20" fill="none" stroke="#C8102E" stroke-width="2" stroke-dasharray="3 5"/>
    <circle cx="176.0" cy="201.0" r="11" fill="#C8102E" stroke="#F2B8C0" stroke-width="2.5"/></g>
  <g fill="none" stroke-width="5" stroke-dasharray="9 7" opacity="0.75">
    <use href="#sole" transform="translate(170.6,390.1) rotate(5.0) scale(0.48)" stroke="#E35A6E"/><use href="#sole" transform="translate(229.4,479.9) rotate(28.0) scale(0.48) scale(-1,1)" stroke="#9FB0C0"/></g>
  <!-- wrong: straight back into the ropes -->
  <line x1="184" y1="446" x2="184" y2="532" stroke="#6E6E73" stroke-width="6" stroke-linecap="round" marker-end="url(#ahw)"/>
  <!-- correct: dip (roll) and step laterally, finishing back toward the centre -->
  <path d="M236,430 C276,468 330,470 344,420 C352,392 344,372 336,362" fill="none" stroke="#8FA35A" stroke-width="6" stroke-linecap="round" marker-end="url(#aho)"/>
  <g transform="translate(266.7,302.1) rotate(-34.5) scale(0.48)"><use href="#sole" fill="#C8102E" stroke="#F2B8C0" stroke-width="3.5"/></g><g transform="translate(369.3,333.9) rotate(-11.5) scale(0.48)">
    <use href="#sole" transform="scale(-1,1)" fill="#6B7F92" stroke="#C9D3DC" stroke-width="3.5"/>
    <g clip-path="url(#heel)"><use href="#sole" transform="scale(-1,1)" fill="#2B333B" opacity="0.75"/></g>
    <g stroke="#C9D3DC" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <line x1="-14" y1="58" x2="14" y2="58"/><line x1="-16" y1="70" x2="16" y2="70"/></g></g>
  <path d="M260.0,260.0 L222.0,222.0" stroke="#8FA35A" stroke-width="5" stroke-linecap="round" marker-end="url(#aho)"/>
  <g stroke="#E35A6E" stroke-width="7" stroke-linecap="round">
    <line x1="166" y1="472" x2="202" y2="508"/><line x1="202" y1="472" x2="166" y2="508"/></g>

  <!-- ===== OPTION 2: pivot on the lead foot and turn him onto the ropes ===== -->
  <g opacity="0.55"><circle cx="600.0" cy="205.0" r="28" fill="none" stroke="#8E8E93" stroke-width="3" stroke-dasharray="7 6"/><circle cx="624.0" cy="231.0" r="10" fill="#3A3A3C" stroke="#8E8E93" stroke-width="2.5"/>
    <circle cx="576.0" cy="231.0" r="20" fill="none" stroke="#C8102E" stroke-width="2" stroke-dasharray="3 5"/>
    <circle cx="576.0" cy="231.0" r="11" fill="#C8102E" stroke="#F2B8C0" stroke-width="2.5"/></g>
  <g fill="none" stroke-width="5" stroke-dasharray="9 7" opacity="0.75">
    <use href="#sole" transform="translate(570.6,393.1) rotate(5.0) scale(0.48)" stroke="#E35A6E"/><use href="#sole" transform="translate(629.4,482.9) rotate(28.0) scale(0.48) scale(-1,1)" stroke="#9FB0C0"/></g>
  <!-- B forced round onto the ropes -->
  <path d="M564,215 C470,230 430,340 458.5,459.2" fill="none" stroke="#8E8E93" stroke-width="5" stroke-dasharray="3 11" stroke-linecap="round" marker-end="url(#ahg)"/>
  <!-- A: rear foot swings round the pivot -->
  <path d="M665.4,468.9 A118,118 0 0,0 632.5,298.0" fill="none" stroke="#8FA35A" stroke-width="6" stroke-linecap="round" marker-end="url(#aho)"/>
  <circle cx="570.6" cy="393.1" r="34" fill="none" stroke="#B08D57" stroke-width="3" stroke-dasharray="4 6"/>
  <g transform="translate(570.6,393.1) rotate(-130.0) scale(0.48)"><use href="#sole" fill="#C8102E" stroke="#F2B8C0" stroke-width="3.5"/></g><g transform="translate(592.5,288.0) rotate(-107.0) scale(0.48)">
    <use href="#sole" transform="scale(-1,1)" fill="#6B7F92" stroke="#C9D3DC" stroke-width="3.5"/>
    <g clip-path="url(#heel)"><use href="#sole" transform="scale(-1,1)" fill="#2B333B" opacity="0.75"/></g>
    <g stroke="#C9D3DC" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <line x1="-14" y1="58" x2="14" y2="58"/><line x1="-16" y1="70" x2="16" y2="70"/></g></g>
  <g><circle cx="464.5" cy="499.2" r="28" fill="#3A3A3C" stroke="#8E8E93" stroke-width="2"/>
    <circle cx="464.5" cy="499.2" r="15" fill="none" stroke="#8E8E93" stroke-width="3"/>
    <circle cx="464.5" cy="499.2" r="5" fill="#8E8E93"/></g>

  <!-- option numbers -->
  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="70" cy="70" r="20" fill="#8FA35A"/><text x="70" y="78" fill="#1A1A1A">1</text>
    <circle cx="470" cy="70" r="20" fill="#8FA35A"/><text x="470" y="78" fill="#1A1A1A">2</text>
  </g>
</svg>
