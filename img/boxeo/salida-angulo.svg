<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <path id="sole" d="M6,-84 C26,-84 37,-66 35,-42 C33,-20 22,-4 20,14 C18,32 26,50 24,66 C22,82 10,88 0,88 C-14,88 -25,80 -25,64 C-25,46 -29,22 -33,0 C-37,-24 -37,-50 -31,-64 C-25,-78 -10,-84 6,-84 Z"/>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E8E4DC"/></marker>
    <marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8FA35A"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8E8E93"/></marker>
    <marker id="ahw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6E6E73"/></marker>
    <clipPath id="heel"><rect x="-40" y="46" width="80" height="50"/></clipPath>
  </defs>
  <rect x="0" y="0" width="800" height="600" rx="28" fill="#1A1A1A"/>
  <rect x="0" y="0" width="800" height="600" rx="28" fill="url(#grid)"/>

  <!-- opponent's line of attack (dashed, straight down the centre) -->
  <line x1="400" y1="134" x2="400" y2="476" stroke="#8E8E93" stroke-width="3" stroke-dasharray="4 10" stroke-linecap="round" opacity="0.8"/>

  <!-- opponent -->
  <g transform="translate(400,92)">
    <circle r="36" fill="#3A3A3C" stroke="#8E8E93" stroke-width="2"/>
    <circle r="21" fill="none" stroke="#8E8E93" stroke-width="3"/>
    <circle r="7" fill="#8E8E93"/>
  </g>

  <!-- the 1-2 combination landing on the opponent -->
  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <line x1="372" y1="262" x2="382" y2="146" stroke="#C8102E" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
    <line x1="428" y1="300" x2="418" y2="146" stroke="#C8102E" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
    <circle cx="352" cy="176" r="16" fill="#C8102E"/><text x="352" y="183" fill="#FFFFFF">1</text>
    <circle cx="448" cy="176" r="16" fill="#C8102E"/><text x="448" y="183" fill="#FFFFFF">2</text>
  </g>

  <!-- START: faded outlines, square in front of the opponent -->
  <g fill="none" stroke-width="4.5" stroke-dasharray="10 8" opacity="0.75">
    <use href="#sole" transform="translate(362.0,307.0) rotate(5.0) scale(0.62)" stroke="#E35A6E"/>
    <use href="#sole" transform="translate(438.0,423.0) rotate(28.0) scale(0.62) scale(-1,1)" stroke="#9FB0C0"/>
  </g>

  <!-- WRONG: retreating straight back on the line -->
  <g opacity="0.85">
    <line x1="400" y1="492" x2="400" y2="566" stroke="#6E6E73" stroke-width="6" stroke-linecap="round" marker-end="url(#ahw)"/>
    <g stroke="#E35A6E" stroke-width="7" stroke-linecap="round">
      <line x1="378" y1="508" x2="422" y2="552"/><line x1="422" y1="508" x2="378" y2="552"/>
    </g>
  </g>

  <!-- CORRECT: step off the line to a 45 degree angle -->
  <path d="M370.0,405.0 Q300,470 245.0,307.0" fill="none" stroke="#8FA35A" stroke-width="6" stroke-linecap="round" marker-end="url(#aho)"/>

  <!-- END: solid, at 45 degrees, still facing the opponent -->
  <g transform="translate(221.1,217.2) rotate(50.0) scale(0.62)"><use href="#sole" fill="#C8102E" stroke="#F2B8C0" stroke-width="3"/></g>
  <g transform="translate(192.8,352.9) rotate(73.0) scale(0.62)">
    <use href="#sole" transform="scale(-1,1)" fill="#6B7F92" stroke="#C9D3DC" stroke-width="3"/>
    <g clip-path="url(#heel)"><use href="#sole" transform="scale(-1,1)" fill="#2B333B" opacity="0.75"/></g>
    <g stroke="#C9D3DC" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
      <line x1="-14" y1="58" x2="14" y2="58"/><line x1="-16" y1="68" x2="16" y2="68"/><line x1="-12" y1="78" x2="12" y2="78"/>
    </g></g>
  <line x1="274.1" y1="217.9" x2="313.0" y2="179.0" stroke="#E8E4DC" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>
</svg>
