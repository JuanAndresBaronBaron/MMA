<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <path id="sole" d="M6,-84 C26,-84 37,-66 35,-42 C33,-20 22,-4 20,14 C18,32 26,50 24,66 C22,82 10,88 0,88 C-14,88 -25,80 -25,64 C-25,46 -29,22 -33,0 C-37,-24 -37,-50 -31,-64 C-25,-78 -10,-84 6,-84 Z"/>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E8E4DC"/></marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E8E4DC"/></marker>
    <clipPath id="heel"><rect x="-40" y="46" width="80" height="50"/></clipPath>
    <radialGradient id="gB" cx="400" cy="150" r="380" gradientUnits="userSpaceOnUse"><stop offset="0.15" stop-color="#B08D57" stop-opacity="0.34"/><stop offset="1" stop-color="#B08D57" stop-opacity="0.04"/></radialGradient>
    <radialGradient id="gC" cx="400" cy="150" r="380" gradientUnits="userSpaceOnUse"><stop offset="0.15" stop-color="#C8102E" stop-opacity="0.38"/><stop offset="1" stop-color="#C8102E" stop-opacity="0.04"/></radialGradient>
  </defs>
  <rect x="0" y="0" width="800" height="600" rx="28" fill="#1A1A1A"/>
  <rect x="0" y="0" width="800" height="600" rx="28" fill="url(#grid)"/>

  <!-- opponent's power zones: right hand (2, brass) on screen-left, left hook (3, crimson) on screen-right -->
  <path d="M312.9,499.3 A360,360 0 0 1 50.7,237.1 L400.0,150.0 A0.01,0.01 0 0 0 400.0,150.0 Z" fill="url(#gB)"/>
  <path d="M487.1,499.3 A360,360 0 0 0 749.3,237.1 L400.0,150.0 A0.01,0.01 0 0 1 400.0,150.0 Z" fill="url(#gC)"/>
  <path d="M312.9,499.3 A360,360 0 0 1 50.7,237.1" fill="none" stroke="#B08D57" stroke-width="3" stroke-dasharray="3 8" stroke-linecap="round"/>
  <path d="M487.1,499.3 A360,360 0 0 0 749.3,237.1" fill="none" stroke="#C8102E" stroke-width="3" stroke-dasharray="3 8" stroke-linecap="round" opacity="0.9"/>

  <!-- opponent (orthodox, facing down) -->
  <circle cx="400" cy="150" r="22" fill="#2C2C2E" stroke="#8E8E93" stroke-width="2"/>
  <use href="#sole" transform="translate(441.4,212.1) rotate(185.0) scale(0.55)" fill="#3A3A3C" stroke="#8E8E93" stroke-width="3"/>
  <use href="#sole" transform="translate(358.6,87.9) rotate(208.0) scale(0.55) scale(-1,1)" fill="#3A3A3C" stroke="#8E8E93" stroke-width="3"/>

  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <circle cx="307.7" cy="268.2" r="17" fill="#B08D57"/><text x="307.7" y="275.2" fill="#1A1A1A">2</text>
    <circle cx="492.3" cy="268.2" r="17" fill="#C8102E"/><text x="492.3" y="275.2" fill="#FFFFFF">3</text>
  </g>

  <!-- START: faded outlines, square in front -->
  <g fill="none" stroke-width="4.5" stroke-dasharray="10 8" opacity="0.75">
    <use href="#sole" transform="translate(364.0,366.0) rotate(5.0) scale(0.55)" stroke="#E35A6E"/>
    <use href="#sole" transform="translate(436.0,474.0) rotate(28.0) scale(0.55) scale(-1,1)" stroke="#9FB0C0"/>
  </g>

  <!-- movement arcs around the opponent -->
  <path d="M446.1,441.4 A295,295 0 0 0 604.9,362.2" fill="none" stroke="#E8E4DC" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)"/>
  <path d="M353.9,441.4 A295,295 0 0 1 195.1,362.2" fill="none" stroke="#E8E4DC" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- END positions: solid, still facing the opponent -->
  <g transform="translate(564.1,295.0) rotate(-53.0) scale(0.55)"><use href="#sole" fill="#C8102E" stroke="#F2B8C0" stroke-width="3"/></g><g transform="translate(693.8,291.2) rotate(-30.0) scale(0.55)">
    <use href="#sole" transform="scale(-1,1)" fill="#6B7F92" stroke="#C9D3DC" stroke-width="3"/>
    <g clip-path="url(#heel)"><use href="#sole" transform="scale(-1,1)" fill="#2B333B" opacity="0.75"/></g>
    <g stroke="#C9D3DC" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
      <line x1="-14" y1="58" x2="14" y2="58"/><line x1="-16" y1="68" x2="16" y2="68"/><line x1="-12" y1="78" x2="12" y2="78"/>
    </g></g>
  <g transform="translate(197.7,233.9) rotate(63.0) scale(0.55)"><use href="#sole" fill="#C8102E" stroke="#F2B8C0" stroke-width="3"/></g><g transform="translate(144.3,352.2) rotate(86.0) scale(0.55)">
    <use href="#sole" transform="scale(-1,1)" fill="#6B7F92" stroke="#C9D3DC" stroke-width="3"/>
    <g clip-path="url(#heel)"><use href="#sole" transform="scale(-1,1)" fill="#2B333B" opacity="0.75"/></g>
    <g stroke="#C9D3DC" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
      <line x1="-14" y1="58" x2="14" y2="58"/><line x1="-16" y1="68" x2="16" y2="68"/><line x1="-12" y1="78" x2="12" y2="78"/>
    </g></g>
  <line x1="561.1" y1="250.7" x2="525.5" y2="228.4" stroke="#E8E4DC" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>
  <line x1="238.9" y1="250.7" x2="274.5" y2="228.4" stroke="#E8E4DC" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- southpaw inset: same picture mirrored -->
  <g>
    <rect x="616" y="420" width="168" height="164" rx="16" fill="#232325" stroke="#48484A" stroke-width="1.5"/>
    <path d="M719.3,575.3 A70,70 0 0 0 766.6,529.6 L732.3,518.5 A34,34 0 0 1 709.4,540.7 Z" fill="#B08D57" opacity="0.45"/>
    <path d="M680.7,575.3 A70,70 0 0 1 633.4,529.6 L667.7,518.5 A34,34 0 0 0 690.6,540.7 Z" fill="#C8102E" opacity="0.5"/>
    <use href="#sole" transform="translate(683.8,532.3) rotate(175.0) scale(0.24) scale(-1,1)" fill="#3A3A3C" stroke="#8E8E93" stroke-width="3"/>
    <use href="#sole" transform="translate(716.2,483.7) rotate(152.0) scale(0.24)" fill="#3A3A3C" stroke="#8E8E93" stroke-width="3"/>
    <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <circle cx="736.1" cy="545.4" r="10" fill="#B08D57"/><text x="736.1" y="549.9" fill="#1A1A1A">2</text>
      <circle cx="663.9" cy="545.4" r="10" fill="#C8102E"/><text x="663.9" y="549.9" fill="#FFFFFF">3</text>
    </g>
    <path d="M662,452 Q700,432 738,452" fill="none" stroke="#E8E4DC" stroke-width="3.5" stroke-linecap="round" marker-start="url(#ahm)" marker-end="url(#ahm)"/>
  </g>
</svg>
